<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-WlWtHfqTH3F5oT7sQ2utrVCgub1ocsRmN/Aq6lxQep8='; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmnesicWallet — Offline Wallet Generator</title>
  <style>
    /* Offline by design: system fonts only, nothing is downloaded. */

    /* ── Seed standard choice ── */
    .std-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .std-card { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 15px 16px;
      border-radius: 11px; border: 1.5px solid var(--border); background: var(--bg);
      color: var(--text); cursor: pointer; transition: all .16s; font-family: var(--font-sans); }
    .std-card:hover { border-color: var(--text-muted); }
    .std-active { border-color: var(--accent); background: var(--accent-glow); }
    .std-name { font-weight: 800; font-size: 15px; letter-spacing: -.2px; }
    .std-sub { font-size: 11.5px; color: var(--accent); font-weight: 600; }
    .std-note { font-size: 11.5px; color: var(--text-muted); line-height: 1.55; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border); }
    .std-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-top: 3px; }
    @media (max-width: 560px) { .std-grid { grid-template-columns: 1fr; } }

    /* ── Multisig keys ── */
    .keys-list { display: flex; flex-direction: column; gap: 12px; }
    .key-block { padding: 14px 15px; border: 1px solid var(--border); border-radius: 11px; background: var(--bg); }
    .key-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
    .key-title { font-weight: 700; font-size: 14.5px; }
    .key-tag { font-size: 11px; color: var(--text-dim); padding: 2px 8px; border: 1px solid var(--border); border-radius: 20px; }

    /* ── Numbered instructions ── */
    .steps-box { display: flex; flex-direction: column; gap: 11px; }
    .step-line { display: flex; gap: 11px; align-items: flex-start; }
    .sl-n {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .sl-t { font-size: 13px; line-height: 1.6; color: var(--text-dim); padding-top: 2px; }

    .watch-panel { margin-top: 14px; padding: 16px; border-radius: 12px; border: 1px solid rgba(96,165,250,.32); background: rgba(96,165,250,.06); }
    .wp-head { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; color: var(--info); }

    /* ── Read-only codes card ── */
    .watch-card { border-color: rgba(96,165,250,.3); }
    .wc-explain { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .wc-item { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; }
    .wc-name { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--info); min-width: 74px; }
    .wc-txt { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; }
    .wc-print { padding: 10px 12px; background: var(--accent-glow); border: 1px solid var(--border-accent); border-radius: 9px; }
    @media (max-width: 560px) { .wc-item { flex-direction: column; gap: 4px; } }

    /* ── Light theme ── */
    html[data-theme="light"] {
      --bg: #f7f7fa;
      --bg-card: #ffffff;
      --bg-card-hover: #fafafc;
      --bg-elevated: #f0f0f5;
      --border: #e2e2ec;
      --border-accent: #d0d0e0;
      --text: #16161f;
      --text-dim: #5a5a72;
      --text-muted: #8a8aa0;
      --accent: #d97706;
      --accent-glow: rgba(217, 119, 6, 0.10);
      --accent-hover: #b45309;
      --success: #15803d;
      --ok-text: #14532d;
      --danger-text: #991b1b;
      --pro-text: #166534;
      --accent-soft: #15803d;
      --info-soft: #1d4ed8;
      --danger: #dc2626;
      --info: #2563eb;
    }
    html[data-theme="light"] body { background: var(--bg); }
    html[data-theme="light"] .ov { background: rgba(20, 20, 35, .45); }

    /* theme switch */
    .logo-clickable { cursor: pointer; border-radius: 10px; padding: 4px 8px; margin: -4px -8px; transition: background .15s; }
    .logo-clickable:hover { background: var(--bg-card-hover); }

    .theme-btn {
      position: absolute; top: 0; right: 0;
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text); cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: all .18s;
    }
    .theme-btn:hover { border-color: var(--accent); background: var(--accent-glow); }
    .app-header { position: relative; }

    :root {
      --bg: #08080d;
      --bg-card: #101018;
      --bg-card-hover: #16161f;
      --bg-elevated: #1a1a26;
      --border: #1c1c2c;
      --border-accent: #28283e;
      --text: #eaeaf2;
      --text-dim: #8888a0;
      --text-muted: #555570;
      --accent: #f7931a;
      --accent-glow: rgba(247, 147, 26, 0.12);
      --accent-hover: #ffa83a;
      --success: #22c55e;
      --ok-text: #b9f2cd;
      --danger-text: #ffb4b4;
      --pro-text: #a5e6bd;
      --accent-soft: #7ee2a8;
      --info-soft: #93c5fd;
      --danger: #ef4444;
      --info: #60a5fa;
      --radius: 14px;
      --radius-sm: 8px;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
      --font-sans: 'Space Grotesk', -apple-system, 'Segoe UI', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-icon { color: var(--accent); display: flex; }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
    }
    header h1 .logo-accent { color: var(--accent); }
    @media (max-width: 420px) { header h1 { font-size: 18px; letter-spacing: 2.5px; } }

    .subtitle {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .security-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--success);
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.18);
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 24px;
      transition: border-color 0.25s;
    }

    .card:hover { border-color: var(--border-accent); }

    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .card-header h2 {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .step-badge {
      width: 32px; height: 32px;
      background: var(--accent);
      color: #000;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
      flex-shrink: 0;
    }

    .status-ok {
      font-size: 12px;
      color: var(--success);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Hero Card ── */
    .hero-card {
      text-align: center;
      padding: 64px 32px;
      border: 1px dashed var(--border-accent);
      background: linear-gradient(180deg, var(--bg-card) 0%, rgba(247, 147, 26, 0.03) 100%);
    }

    .card-icon { margin-bottom: 24px; color: var(--accent); }

    .hero-card h2 { font-size: 24px; margin-bottom: 12px; }

    .card-desc {
      color: var(--text-dim);
      max-width: 620px;
      margin: 0 auto 32px;
      font-size: 14px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .btn:hover { background: var(--bg-card-hover); border-color: var(--text-muted); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    .btn:active:not(:disabled) { transform: scale(0.97); }

    .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .btn-large { padding: 14px 32px; font-size: 15px; }
    .btn-full { width: 100%; justify-content: center; }
    .btn-outline { background: transparent; }
    .btn-ghost { border-color: transparent; }
    .btn-small { font-size: 11px; padding: 5px 12px; }

    .btn-danger { color: var(--danger); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.1); border-color: var(--danger); }

    .btn-success { border-color: var(--success) !important; color: var(--success) !important; background: rgba(34, 197, 94, 0.1) !important; }

    .btn-icon {
      padding: 6px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .btn-primary .spinner { border-color: rgba(0,0,0,0.2); border-top-color: #000; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-sans);
      z-index: 9999;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .toast-success { background: #166534; color: #bbf7d0; border: 1px solid #22c55e; }
    .toast-error   { background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; }
    .toast-info    { background: #1e3a5f; color: #bfdbfe; border: 1px solid #60a5fa; }

    /* ── Seed Display ── */
    .guide-nav { display: flex; gap: 8px; margin-top: 4px; }
    .gn-btn { flex: 1; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text-dim); font-size: 13.5px; font-weight: 600;
      cursor: pointer; transition: all .15s; font-family: var(--font-sans); }
    .gn-btn:hover { border-color: var(--text-muted); }
    .gn-active { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); }

    .path-demo { padding: 16px; border: 1px solid var(--border); border-radius: 11px; background: var(--bg); }
    .pd-full { display: block; text-align: center; font-family: var(--font-mono); font-size: 16px;
      color: var(--accent); letter-spacing: 1px; padding-bottom: 12px; margin-bottom: 12px;
      border-bottom: 1px solid var(--border); }
    .pd-legend { display: flex; flex-direction: column; gap: 9px; }
    .pd-row { display: flex; gap: 11px; align-items: flex-start; }
    .pd-row code { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent);
      min-width: 42px; text-align: right; flex-shrink: 0; padding-top: 1px; }
    .pd-row span { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; }
    @media (max-width: 560px) { .pd-row { flex-direction: column; gap: 2px; } .pd-row code { text-align: left; } }

    .btn-newwallet {
      border: 1.5px solid var(--accent) !important; color: var(--accent) !important;
      background: var(--accent-glow) !important; font-weight: 700 !important;
    }
    .btn-newwallet:hover { background: var(--accent) !important; color: #fff !important; }

    /* ── Contextual help ── */
    .help-dot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 17px; height: 17px; border-radius: 50%; margin-left: 6px;
      border: 1px solid var(--border-accent); background: transparent;
      color: var(--text-muted); font-size: 11px; font-weight: 700;
      cursor: pointer; vertical-align: middle; line-height: 1; padding: 0;
      transition: all .15s; font-family: var(--font-sans); flex-shrink: 0;
    }
    .help-dot:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .help-pop {
      position: absolute; z-index: 100000; width: 320px;
      background: var(--bg-card); border: 1px solid var(--border-accent);
      border-radius: 12px; padding: 14px 16px;
      box-shadow: 0 10px 34px rgba(0,0,0,.28);
    }
    .hp-title { font-weight: 700; font-size: 13.5px; margin-bottom: 6px; color: var(--accent); }
    .hp-text { font-size: 12.5px; line-height: 1.6; color: var(--text-dim); }
    .hp-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

    /* ── Help: end ── */

    /* ── Seed locked once it has been split ── */
    .seed-locked {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 28px 20px; border: 1.5px dashed var(--border-accent);
      border-radius: 12px; background: var(--bg); text-align: center;
    }
    .sl-icon { font-size: 30px; line-height: 1; opacity: .8; }
    .sl-text { font-size: 13px; color: var(--text-dim); max-width: 420px; line-height: 1.55; }

    .seed-display { margin-bottom: 20px; }

    .seed-masked {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .word-slot {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .word-slot em {
      font-style: normal;
      color: var(--text-dim);
      font-size: 11px;
      min-width: 18px;
    }

    .seed-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .seed-warning {
      font-size: 12px;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(247, 147, 26, 0.15);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      line-height: 1.5;
    }

    /* ── Chain Selection ── */
    .chain-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .chain-option input { display: none; }

    .chain-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; text-align: center;
    }

    .chain-box:hover { border-color: var(--text-muted); background: var(--bg-card-hover); }

    .chain-option input:checked + .chain-box {
      border-color: var(--accent);
      background: var(--accent-glow);
      box-shadow: 0 0 24px rgba(247, 147, 26, 0.06);
    }

    .chain-icon { font-size: 26px; line-height: 1; }
    .chain-name { font-weight: 600; font-size: 13px; }

    .chain-tag {
      font-size: 10px;
      color: var(--text-dim);
      background: var(--bg);
      padding: 2px 10px;
      border-radius: 10px;
    }

    /* ── Results ── */
    .addresses-list {
      display: flex; flex-direction: column;
      gap: 20px; margin-bottom: 28px;
    }

    .address-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 24px;
      background: var(--bg);
    }

    .address-header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 16px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .address-header-text { min-width: 0; }

    .addr-icon {
      font-size: 22px;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-glow);
      border-radius: 10px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .address-header strong { font-size: 15px; }

    .evm-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

    .evm-tag {
      font-size: 10px;
      background: var(--bg-card);
      color: var(--text-dim);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .address-details { display: flex; flex-direction: column; gap: 10px; }

    .detail-row { display: flex; flex-direction: column; gap: 4px; }

    .detail-label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail-value {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: var(--bg-card);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      word-break: break-all;
      flex: 1;
      min-width: 0;
    }

    .path-value { color: var(--accent); }

    .addr-copy-row {
      display: flex;
      align-items: stretch;
      gap: 6px;
    }

    .address-qr {
      display: flex; justify-content: center;
      margin-top: 16px;
      min-height: 60px;
    }

    .address-qr img {
      border-radius: 8px;
      border: 4px solid #fff;
    }

    .qr-loading, .qr-error {
      font-size: 12px;
      color: var(--text-muted);
      display: flex; align-items: center;
    }

    .qr-error { color: var(--danger); }

    /* ── Footer ── */
    footer {
      margin-top: 48px; padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    footer p { font-size: 12px; color: var(--text-muted); }

    /* ── Responsive ── */
    /* Wide desktop: use the space instead of leaving empty bands */
    @media (min-width: 1280px) {
      .container { max-width: 1080px; }
      .card { padding: 32px 38px; }
      body { font-size: 15.5px; }
      .seed-masked { grid-template-columns: repeat(4, 1fr); }
      .part-words { grid-template-columns: repeat(4, 1fr); }
      .chain-grid { grid-template-columns: repeat(5, 1fr); }
      .fmt-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 1600px) {
      .container { max-width: 1180px; }
      .card { padding: 36px 44px; }
      body { font-size: 16.5px; }
      .fmt-grid { grid-template-columns: repeat(4, 1fr); }
      .chain-grid { grid-template-columns: repeat(5, 1fr); }
      .seed-masked { grid-template-columns: repeat(6, 1fr); }
      .part-words { grid-template-columns: repeat(5, 1fr); }
    }

    @media (max-width: 640px) {
      .container { padding: 20px 16px; }
      header { flex-direction: column; gap: 16px; text-align: center; }
      .logo-area { flex-direction: column; }
      .seed-masked { grid-template-columns: repeat(3, 1fr); }
      .chain-grid { grid-template-columns: repeat(2, 1fr); }
      .seed-actions { flex-direction: column; }
      .seed-actions .btn { justify-content: center; }
      .card { padding: 20px; }
    }

    /* ── RNG Warning ── */
    .rng-warning {
      font-size: 13px;
      color: var(--danger);
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      margin-bottom: 24px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }


    /* ── Tabs ── */
    .tabs { display: flex; gap: 6px; margin-bottom: 28px; flex-wrap: wrap; }
    .tab {
      padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--text-dim); font-family: var(--font-sans);
      font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .tab:hover { color: var(--text); border-color: var(--border-accent); }
    .tab-active { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }

    /* ── Config ── */
    .config-box { text-align: left; max-width: 100%; margin: 0 auto 26px; }
    .config-row { margin-bottom: 14px; }
    .config-label-center { text-align: center; display: block; font-size: 16px; margin-bottom: 4px; }

    .config-label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
    .hint { display: block; font-size: 12px; color: var(--text-dim); font-weight: 400; margin-top: 2px; line-height: 1.5; }
    .seg { display: flex; gap: 6px; margin-top: 8px; }
    .seg-btn {
      flex: 1; padding: 10px 0; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text-dim); font-family: var(--font-mono);
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    .seg-btn:hover { border-color: var(--text-muted); }
    .seg-active { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }
    .inp {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: 13px;
    }
    .inp:focus { outline: none; border-color: var(--accent); }
    textarea.inp { resize: vertical; line-height: 1.6; }
    select.inp { font-family: var(--font-sans); }
    .chk-row { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; cursor: pointer; }
    .chk-row input { margin-top: 3px; accent-color: var(--accent); }

    details.adv { border: 1px dashed var(--border-accent); border-radius: 8px; padding: 10px 14px; margin-top: 14px; }
    details.adv summary { cursor: pointer; font-size: 13px; color: var(--text-dim); font-weight: 600; }
    details.adv summary:hover { color: var(--text); }
    .adv-body { margin-top: 12px; }

    /* ── Overlay ── */
    .ov {
      position: fixed; inset: 0; background: rgba(5,5,10,.82); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px;
    }
    .ov-card {
      background: var(--bg-card); border: 1px solid var(--border-accent); border-radius: var(--radius);
      padding: 28px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto;
    }
    .ov-card h3 { font-size: 19px; margin-bottom: 12px; }
    .ov-card p { font-size: 14px; color: var(--text); margin-bottom: 10px; line-height: 1.6; }
    .ov-strong { font-weight: 700; margin-top: 8px; }
    .ov-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .ov-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .progress { height: 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); overflow: hidden; margin-top: 12px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-hover)); width: 0%; transition: width .15s; border-radius: 6px; }

    .mouse-area {
      position: relative; height: 210px; border: 2px dashed var(--border-accent); border-radius: 12px;
      margin-top: 14px; background: var(--bg); overflow: hidden; touch-action: none; cursor: crosshair;
    }
    .mouse-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 14px; pointer-events: none; }
    .mouse-area canvas { position: absolute; inset: 0; }

    .dice-counter { text-align: center; font-size: 14px; margin-top: 10px; color: var(--text-dim); }
    .dice-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 14px; }
    .dice-btn {
      padding: 12px 0 8px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 30px; line-height: 1; cursor: pointer; transition: all .12s;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .dice-btn span { font-size: 11px; color: var(--text-dim); font-family: var(--font-sans); }
    .dice-btn:hover { border-color: var(--accent); color: var(--accent); }
    .dice-btn:active, .dice-pop { transform: scale(.93); background: var(--accent-glow); }

    /* ── Information boxes ── */
    .warn-box {
      font-size: 13px; color: var(--danger-text); background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.28); border-radius: 8px; padding: 12px 14px; line-height: 1.55;
    }
    .ok-box {
      font-size: 13px; color: var(--ok-text); background: rgba(34,197,94,.08);
      border: 1px solid rgba(34,197,94,.35); border-radius: 8px; padding: 12px 14px; line-height: 1.55;
    }
    .share-box {
      border: 1px solid rgba(34,197,94,.35); background: rgba(34,197,94,.05);
      border-radius: 10px; padding: 16px;
    }
    .share-head { font-weight: 700; font-size: 14px; margin-bottom: 10px; color: var(--accent-soft); }
    .vault-diagram {
      font-size: 14px; text-align: center; line-height: 2; background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    }

    /* ── Shamir parts ── */
    .part-words { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-top: 10px; }
    .part-word {
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px;
      font-family: var(--font-mono); font-size: 12.5px; display: flex; gap: 7px; align-items: center;
    }
    .part-word em { font-style: normal; color: var(--text-dim); font-size: 10px; min-width: 15px; }
    .part-meta { margin-top: 12px; font-size: 12.5px; color: var(--text-dim); text-align: center; }
    .rec-part { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
    .rec-part-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 13.5px; font-weight: 600; }

    /* ── Self-check ── */
    .st-list { display: flex; flex-direction: column; gap: 6px; }
    .st-row {
      display: flex; gap: 10px; align-items: center; padding: 9px 13px; border-radius: 8px;
      font-size: 13px; border: 1px solid var(--border); background: var(--bg);
    }
    .st-row code { margin-left: auto; }
    .st-ok { border-color: rgba(34,197,94,.25); }
    .st-fail { border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.06); }



    .ov-badge {
      display: inline-block; font-size: 11.5px; font-weight: 600; color: var(--accent);
      background: var(--accent-glow); border: 1px solid var(--border-accent);
      padding: 5px 11px; border-radius: 20px; margin-bottom: 12px;
    }



    /* ── Bitcoin format selector ── */
    .btc-fmt-box { margin: 18px 0; padding: 16px; border: 1px dashed var(--border-accent); border-radius: 12px; }
    .fmt-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
    .fmt-card {
      display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 12px 14px;
      border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg);
      color: var(--text); cursor: pointer; transition: all .15s; font-family: var(--font-sans);
    }
    .fmt-card:hover { border-color: var(--text-muted); }
    .fmt-active { border-color: var(--accent); background: var(--accent-glow); }
    .fmt-label { font-weight: 700; font-size: 13.5px; }
    .fmt-tag { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
    .fmt-desc { font-size: 11.5px; color: var(--text-dim); line-height: 1.45; margin-top: 2px; }
    @media (max-width: 560px) { .fmt-grid { grid-template-columns: 1fr; } }

    /* ── More BTC addresses ── */
    .btc-more { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .more-head { font-weight: 700; font-size: 13.5px; margin-bottom: 6px; }
    .more-list { display: flex; flex-direction: column; gap: 5px; }
    .more-row {
      display: flex; align-items: center; gap: 9px; padding: 7px 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    .more-idx { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); min-width: 26px; }
    .more-addr { font-family: var(--font-mono); font-size: 11px; word-break: break-all; flex: 1; }

    /* ── Accounts and derivation paths (Check tab) ── */
    .acct-bar { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .acct-label { font-weight: 700; font-size: 14px; }
    .acct-num { font-family: var(--font-mono); font-size: 22px; min-width: 2.2em; text-align: center; }
    .acct-btn { min-width: 44px; min-height: 40px; font-size: 20px; line-height: 1; padding: 4px 12px; }
    .acct-btn:disabled { opacity: .35; cursor: default; }
    .ap-chain { margin-top: 16px; }
    .xp-as .seg-btn { flex: 1 1 calc(33% - 6px); min-width: 0; white-space: normal; padding: 10px 6px; font-size: 13px; }
    @media (max-width: 560px) { .xp-as .seg-btn { flex-basis: calc(50% - 6px); } }
    .ap-row { padding: 10px 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
    .ap-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ap-top code { font-family: var(--font-mono); font-size: 12px; word-break: break-all; }
    .ap-tag { font-size: 10.5px; padding: 1px 8px; border-radius: 20px; border: 1px solid var(--accent); color: var(--accent); }
    .ap-tag-odd { border-color: var(--text-dim); color: var(--text-dim); }
    .ap-odd { opacity: .85; }
    .ap-fmt { font-size: 10.5px; color: var(--text-dim); min-width: 92px; }
    .ap-main { border-color: var(--accent); }
    @media (max-width: 420px) { .ap-row .more-row { flex-wrap: wrap; } .ap-fmt { min-width: 0; width: 100%; } }

    /* ── Watch-only ── */
    .watch-box {
      margin: 18px 0; padding: 18px; border-radius: 12px;
      border: 1px solid rgba(96,165,250,.32); background: rgba(96,165,250,.06);
    }
    .watch-head { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; color: var(--info-soft); }


    /* ── Powers-of-2 grid ── */
    .metal-demo { margin: 14px 0; padding: 14px 16px; border-radius: 10px; border: 1px dashed var(--border-accent); background: var(--accent-glow); }
    .metal-demo-head { font-weight: 700; font-size: 13.5px; margin-bottom: 6px; }
    .metal-demo p { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin: 0 0 10px; }
    .metal-demo-row { display: flex; flex-direction: column; gap: 3px; padding-top: 8px; border-top: 1px solid var(--border); }
    .mdr-label { font-size: 11.5px; color: var(--text-dim); }
    .mdr-cells { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }

    .ov-narrow { max-width: 440px; }
    .ov-wide { max-width: 900px; }

    @media (min-width: 1100px) {
      .ov-card { max-width: 640px; padding: 32px 36px; }
      .ov-narrow { max-width: 440px; }
      .ov-wide { max-width: 880px; }
    }

    /* ── Path chooser (Generate/Check home) ── */
    .path-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
    .path-grid-3 { grid-template-columns: repeat(2, 1fr); }
    .path-card {
      display: flex; flex-direction: column; gap: 7px; text-align: left;
      padding: 22px 20px; border-radius: 14px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text); cursor: pointer;
      transition: all .18s; font-family: var(--font-sans);
    }
    .path-card:hover { border-color: var(--accent); background: var(--accent-glow); transform: translateY(-2px); }
    .path-icon { font-size: 30px; line-height: 1; }
    .path-title { font-weight: 800; font-size: 16.5px; letter-spacing: -.2px; }
    .path-desc { font-size: 13px; color: var(--text-dim); line-height: 1.55; flex: 1; }
    .path-cta { font-size: 13px; font-weight: 700; color: var(--accent); margin-top: 4px; }
    @media (max-width: 700px) { .path-grid, .path-grid-3 { grid-template-columns: 1fr; } }

    /* ── Neutral note (information without alarm) ── */
    .note-box {
      padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.6;
      background: var(--bg-soft, rgba(255,255,255,.04)); border: 1px solid var(--border);
      color: var(--text-dim);
    }

    /* ── Split method choice ── */
    .split-choice {
      border: 1.5px solid var(--border); border-radius: 12px; padding: 16px;
      margin-top: 12px; cursor: pointer; transition: all .15s; background: var(--bg);
    }
    .split-choice:hover { border-color: var(--accent); background: var(--accent-glow); }
    .split-head { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .split-tag { font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
    .tag-easy { background: rgba(96,165,250,.15); color: var(--info-soft); border: 1px solid rgba(96,165,250,.3); }
    .tag-strong { background: rgba(34,197,94,.12); color: var(--accent-soft); border: 1px solid rgba(34,197,94,.3); }
    .split-desc { font-size: 12.5px; color: var(--text-dim); margin: 8px 0 10px; line-height: 1.55; }
    .split-pro { font-size: 12px; color: var(--pro-text); line-height: 1.6; margin-bottom: 6px; }
    .split-con { font-size: 12px; color: var(--text-dim); line-height: 1.6; }

    /* ── Mode cards ── */
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .mode-card {
      display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
      padding: 18px 14px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text); cursor: pointer; transition: all .15s;
      font-family: var(--font-sans);
    }
    .mode-card:hover { border-color: var(--text-muted); }
    .mode-active { border-color: var(--accent); background: var(--accent-glow); }
    .mode-icon { font-size: 30px; }
    .mode-title { font-weight: 700; font-size: 14.5px; }
    .mode-desc { font-size: 12px; color: var(--text-dim); line-height: 1.45; }
    @media (max-width: 560px) { .mode-grid { grid-template-columns: 1fr; } }
    @media (min-width: 1100px) {
      .seg { max-width: 720px; margin-left: auto; margin-right: auto; }
      .mode-grid, .std-grid { gap: 16px; }
    }

    /* ── FAQ ── */
    details.faq {
      border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px;
      background: var(--bg); overflow: hidden;
    }
    details.faq summary {
      cursor: pointer; padding: 14px 16px; font-size: 14.5px; font-weight: 600;
      list-style: none; transition: background .15s;
    }
    details.faq summary::-webkit-details-marker { display: none; }
    details.faq summary:hover { background: var(--accent-glow); }
    details.faq[open] summary { border-bottom: 1px solid var(--border); color: var(--accent); }
    .faq-body { padding: 14px 18px; }
    .faq-body p { font-size: 13.5px; line-height: 1.65; color: var(--text); margin-bottom: 10px; }
    .faq-body p:last-child { margin-bottom: 0; }
    .faq-body strong { color: var(--accent); font-weight: 600; }
    .faq-body em { font-style: italic; }

    /* ── Narrow phones (320–420 px): word grids in two columns, lighter overlays.
       Grid tracks use minmax(0, 1fr) so that no word can widen the page. ── */
    .seed-masked > *, .part-words > * { min-width: 0; overflow-wrap: anywhere; }
    img { max-width: 100%; height: auto; }
    @media (max-width: 420px) {
      .seed-masked, .part-words { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ov { padding: 10px; }
      .ov-card { padding: 22px 18px; max-height: 94vh; }
      .ov-grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
      .dice-grid { gap: 5px; }
    }

    /* ── Print hide (main app) ── */
    @media print { body { display: none !important; } }
  </style>

    <div class="card">
      <div class="faq-list">

        <details class="faq" id="g-entropy" open><summary>\u2B50 Why this way of creating the seed is different</summary><div class="faq-body">
          <p>Everything in a wallet depends on a single number: the starting one. If that number is predictable, it doesn't matter how robust the cryptography downstream is \u2014 the wallet is already lost. That is exactly how real funds have vanished, when a faulty generator produced numbers far less random than they seemed.</p>
          <p><strong>AmnesicWallet's choice is not to depend on a single source.</strong> We mix three (or four, if you use the dice), of completely different natures:</p>
          <p><strong>1 \xB7 The browser's cryptographic generator.</strong> The browser has a built-in cryptographic generator, called a CSPRNG. It is fed directly by the operating system and is made exactly for this purpose.</p>
          <p><strong>2 \xB7 The rhythm of your fingers.</strong> As you type on the keyboard we record <em>when</em> you press each key, to the millisecond. Not the characters \u2014 humans choose those badly \u2014 but the micro-pauses between one key and the next: irregularities born of your physiology that not even you could reproduce.</p>
          <p><strong>3 \xB7 The path of your hand.</strong> Hundreds of coordinates and times as you move the mouse: where you accelerate, where you hesitate, where you change direction. A human movement never repeats itself identically.</p>
          <p><strong>4 \xB7 The dice, if you choose them.</strong> The only source born <em>outside</em> the computer. No software bug can predict a rolling die.</p>
          <p>The sources are fused with <strong>SHA-256</strong>, the same function that protects the Bitcoin network. The property that matters is this: <strong>the result can never be weaker than the best source.</strong> If one gives way, the others hold. It isn't a sum of securities, it's a safety net.</p>
        </div></details>

        <details class="faq" id="g-seed"><summary>\u{1F331} What the seed is, in plain words</summary><div class="faq-body">
          <p>The seed is a sequence of words \u2014 12 to 24 \u2014 that represents the <strong>master key</strong> of your wallet. From it, mathematics derives all your addresses and all the keys to spend, on every network.</p>
          <p>Two truths to keep always in mind:</p>
          <p><strong>Whoever knows the words owns the funds.</strong> There is no identity check, there is no appeal. Never share them with anyone.</p>
          <p><strong>If you lose the words, you lose everything.</strong> There is no "forgot password", there is no customer service. This is the flip side of true ownership.</p>
        </div></details>

        <details class="faq" id="g-passphrase"><summary>\u{1F511} The passphrase: a second lock</summary><div class="faq-body">
          <p>It is a word or phrase of your own choosing that is added to the 12/24 words. Technically it's called a <em>passphrase</em> and it enters the wallet calculation: the same words, with and without it, open <strong>two completely different wallets</strong>.</p>
          <p><strong>What it is really for.</strong> Your paper backup, on its own, becomes useless to whoever finds it: they will see a wallet different from yours, probably empty, without imagining that the real wallet is elsewhere.</p>
          <p><strong>The price to pay.</strong> Forgetting it means losing everything, even with every word of the seed. Keep it somewhere different from the words \u2014 it is the separation that gives it value.</p>
        </div></details>

        <details class="faq"><summary>\u{1F441}\uFE0F Why the words stay covered</summary><div class="faq-body">
          <p>A passing glance, a video call left open, an automatic screenshot: a couple of seconds are enough for a seed to stop being secret. That's why, by default, we don't show it.</p>
          <p>You can copy or print it without ever seeing it, or press <strong>Reveal the words</strong> when you're sure you're alone \u2014 useful for writing it down by hand. The same applies to the parts of a split backup.</p>
        </div></details>

        <details class="faq" id="g-backup"><summary>\u{1F9E9} Splitting the seed: three routes</summary><div class="faq-body">
          <p>Right after creating the wallet, the program asks you <strong>how you want to keep it</strong>: a single backup, split sequentially, or with a Shamir threshold. You can change your mind at any time using the <em>Split into several parts</em> button.</p>
          <p><strong>\u{1F4C4} A single backup.</strong> The words on one sheet only. It's the right choice to start with and for small amounts: immediate, recoverable anywhere. The limit is obvious: if that sheet disappears, everything disappears.</p>
          <p><strong>\u2702\uFE0F Sequential splitting.</strong> The words are cut into consecutive groups: with 12 words and 3 parts you get 1-4, 5-8, 9-12. To reassemble you simply put them back in order without any software. In exchange <strong>all</strong> the parts are needed, and anyone finding two out of three would have few words left to guess.</p>
          <p><strong>\u{1F510} Shamir backup.</strong> Named after the cryptographer Adi Shamir. It doesn't cut the seed, it <em>transforms</em> it into parts that are worth something only together. You choose the threshold \u2014 3 parts, 2 are enough \u2014 so you can lose some without consequence. And below the threshold the parts reveal <strong>nothing</strong> about the seed: not "almost nothing", zero, by theorem. (The short verification code printed on them is only a fingerprint for checking the result.)</p>
          <p><strong>How to choose:</strong> Shamir if you fear theft or loss; sequential if you fear depending on software many years from now.</p>
        </div></details>

        <details class="faq" id="g-standard"><summary>\u{1F4C4} SLIP-39: the backup born already split</summary><div class="faq-body">
          <p>When you create a wallet you can choose between two backup standards. <strong>BIP-39</strong> gives you a single phrase of 12 or 24 words. <strong>SLIP-39</strong> gives you instead several sheets of 20 words each, and some of them \u2014 for example 3 of 5 \u2014 are enough to reopen the wallet.</p>
          <p><strong>The difference that matters.</strong> With BIP-39 the complete phrase exists: you see it, you write it, and from that moment it is your weak point. With SLIP-39 <strong>the whole phrase never exists at any moment</strong>, not even on screen while you create it. Only the sheets exist, and each one alone reveals nothing.</p>
          <p><strong>How to recognise the sheets.</strong> They have 20 words (or 33 for 256-bit backups) and the <strong>first three words are identical</strong> on every sheet of the same backup: they exist precisely to let you see at a glance whether you are mixing sheets from different sets. The words come from a dedicated dictionary of 1024 entries, different from the BIP-39 one.</p>
          <p><strong>Where it is used.</strong> It is the standard that <strong>Trezor</strong> adopts as the default backup on recent models. It is also read by <strong>Sparrow</strong> (from version 2.0), <strong>Electrum</strong>, <strong>Rabby</strong>, <strong>BlueWallet</strong>, <strong>Wasabi</strong> and <strong>Keystone</strong>. So you are not tied to AmnesicWallet: unlike the Shamir backup, this is a public standard.</p>
        </div></details>

        <details class="faq"><summary>\u{1F510} Shamir backup explained properly: what it does and what it doesn't</summary><div class="faq-body">
          <p><strong>What happens when you use it.</strong> The original seed is transformed into several parts \u2014 for example 5 \u2014 and you decide how many are needed to get it back, for example 3. You keep them in different places. When you need the wallet you enter three of them under <em>\u{1F50D} Check wallet \u2192 Shamir backup \u2192 I have the parts, I want the seed</em> and you get <strong>the original seed</strong>. From there you use it wherever you like \u2014 Sparrow, Electrum, MetaMask, a Ledger \u2014 and none of those programs will ever know you used Shamir, because they don't need to.</p>
          <p><strong>You can use it at two different moments, and this is what most often escapes people.</strong></p>
          <p><strong>1. While creating a new wallet.</strong> Right after generation, when the program asks how to keep the seed, choose <em>Shamir backup</em>. The complete phrase is never written out: you start with the backup already split.</p>
          <p><strong>2. On a seed you already own</strong>, even one created years ago with another program. Go to <em>\u{1F50D} Check wallet \u2192 Shamir backup \u2192 I have a seed, I want to split it</em>, enter your words and choose the threshold and number of parts. The wallet does not change: same addresses, funds in place. Only the way you keep it changes. From that moment you can destroy the sheet with the whole phrase and keep only the parts.</p>
          <p>Here is the advantage over a classic seed: with the traditional phrase, whoever finds that sheet has everything. With this system, whoever finds one part has nothing. Several fragments are needed together, someone has to realise they belong together, know this backup exists and have the right program. The difference is this: a normal seed is a single weak point. With Shamir, your funds stay safe even if some piece ends up where it shouldn't.</p>
          <p><strong>A useful way to see it:</strong> the parts are a form of encryption of the backup, where the key is "holding enough parts". With one advantage over a password: there is nothing to remember. And below the threshold no attempt will do \u2014 it isn't hard to guess, it's mathematically impossible. The 4-character verification code printed on the sheets is only a short fingerprint used to confirm the result: it leaves an attacker with at least 2\xB9\xB9\xB2 possibilities, far beyond any computer.</p>
          <p><strong>The parts are not wallets.</strong> Each one is made of words and looks every bit like a seed, but it is a fragment. Don't send funds to it and don't import it into a wallet expecting to find something there. On its own, below the threshold, it is worth nothing \u2014 and that is exactly what makes it safe.</p>
          <p><strong>You need this program to reassemble them.</strong> It is the price of the method and it must be said clearly: <strong>keep a copy of the file <em>amnesicwallet.html</em> together with the parts</strong>. If that dependency bothers you, consider <strong>SLIP-39</strong>, which does the same thing with a public standard read by Trezor, Sparrow and Electrum \u2014 but it must be chosen when creating a new wallet, it does not apply to an existing BIP-39 seed.</p>
          <p><strong>Careful not to confuse it with Trezor's Shamir.</strong> Trezor offers a feature called <em>Shamir Backup</em>, but it uses the SLIP-39 standard. Parts created here <strong>do not work</strong> in Trezor's Shamir recovery, and vice versa. They are two separate systems that share a name.</p>
        </div></details>

        <details class="faq" id="g-powers"><summary>\u{1F522} Powers-of-2 backup</summary><div class="faq-body">
          <p>There is a way of saving the seed that uses no words: <strong>just dots on a grid</strong>.</p>
          <p><strong>The mechanism.</strong> Every word in the BIP-39 dictionary has a number from 1 to 2048, and every number can be written as a sum of powers of two: 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048. The grid has one column for each. The 2045th word, for example, has the boxes 1024, 512, 256, 128, 64, 32, 16, 8, 4 and 1 marked. To find the corresponding word you just add up the numbers on each row.</p>
          <p><strong>Why it is interesting.</strong> There are no words written on the grid and whoever finds it sees only dots. The problem is not reading it, it's understanding it: you would have to know what that grid is, what those dots mean and how they are used.</p>
          <p><strong>How it's done.</strong> From the wallet, press <em>\u{1F522} Powers-of-2 backup</em>. You get a grid with one row per word and the dots already in the right place \u2014 with no words and no numbers: the translation will be up to you at recovery time. Print the numbered dictionary as well and keep it separately.</p>
        </div></details>

        <details class="faq" id="g-formats"><summary>\u20BF The four Bitcoin address formats</summary><div class="faq-body">
          <p>Bitcoin has changed address format several times over the years. From the <strong>same seed</strong> you can generate all four: they are not different wallets, they are different ways of writing the same ownership.</p>
          <p><strong>Native SegWit</strong> (<em>bc1q\u2026</em>) \u2014 Today's standard, and the default choice: low fees and accepted practically everywhere.</p>
          <p><strong>Taproot</strong> (<em>bc1p\u2026</em>) \u2014 The most recent: even lower fees and greater privacy. Some older services don't accept it yet.</p>
          <p><strong>SegWit compatible</strong> (<em>3\u2026</em>) \u2014 A transitional format, accepted even by the oldest services.</p>
          <p><strong>Legacy</strong> (<em>1\u2026</em>) \u2014 The original format from 2009. It always works, but costs more in fees.</p>
          <p>Each format uses a different derivation path, so it produces different addresses. If you are recovering an old wallet and the address doesn't match, try changing format: the seed is probably right.</p>
        </div></details>

        <details class="faq" id="g-derivation"><summary>\u{1F9ED} The derivation path, explained</summary><div class="faq-body">
          <p>From your seed come very many different addresses, not just one. The derivation path indicates which address you are taking among them all.</p>
          <p>It is a sequence of numbers. Each number represents a precise choice, a step along the path.</p>
          <p>Here is a derivation path explained:</p>
          <div class="path-demo">
            <code class="pd-full">m / 84' / 0' / 0' / 0 / 0</code>
            <div class="pd-legend">
              <div class="pd-row"><code>m</code><span>The root: the seed itself. Everything starts here.</span></div>
              <div class="pd-row"><code>84'</code><span><strong>Purpose</strong> \u2014 what kind of address you want. 44 Legacy, 49 SegWit compatible, 84 Native SegWit, 86 Taproot, 48 multisig.</span></div>
              <div class="pd-row"><code>0'</code><span><strong>Coin</strong> \u2014 which network. 0 Bitcoin, 60 Ethereum, 195 TRON, 501 Solana. The numbers are assigned by the SLIP-44 standard.</span></div>
              <div class="pd-row"><code>0'</code><span><strong>Account</strong> \u2014 separate accounts inside the same wallet. The first is 0, the second 1, and so on.</span></div>
              <div class="pd-row"><code>0</code><span><strong>Chain</strong> \u2014 0 for the public addresses you give others to receive, 1 for those used for change, generated by the wallet.</span></div>
              <div class="pd-row"><code>0</code><span><strong>Index</strong> \u2014 the address's sequential number: 0, 1, 2, 3\u2026</span></div>
            </div>
          </div>
          <p style="margin-top:14px"><strong>How many addresses can you have?</strong> Each level of the path allows around two billion possible values. This applies both to accounts and to addresses: you can have billions of different accounts and, inside each account, billions of different addresses.</p>
          <p><strong>What does the apostrophe mean?</strong> It indicates a <em>hardened</em> derivation, that is a reinforced one. Without it, anyone holding an extended public key and a single child private key could work back to the parent key. The apostrophe closes that road. That's why the first three levels always have it.</p>
          <p><strong>Why it concerns you.</strong> If you import the seed elsewhere and the addresses don't match (particularly with Bitcoin, which has several formats), it is almost always the path that differs \u2014 not the seed. It's the reason why a Legacy wallet and a Native SegWit one, though born from the same words, show completely different addresses: they simply sit on different branches of the same tree.</p>
          <p><strong>Not every wallet counts accounts the same way.</strong> \u201CAccount 2\u201D in MetaMask is the second address of the first branch (<code>m/44'/60'/0'/0/1</code>); in Ledger Live it is a branch of its own (<code>m/44'/60'/1'/0/0</code>). Same words, different addresses.</p>
          <p><strong>How to find a missing address.</strong> In <em>Check wallet</em> you can change the account with the + button, see the change addresses of Bitcoin, and open <em>All derivation paths</em>: it lists, for every network, the paths of the best-known wallets and some unusual ones \u2014 for example Bitcoin addresses on Ethereum's path \u2014 and lets you type any path yourself. If you only have the account's public key (xpub, ypub or zpub), <em>A public key only</em> shows its addresses without typing any secret word.</p>
        </div></details>

        <details class="faq" id="g-networks"><summary>\u{1F4EC} Why does Bitcoin have many addresses and the other networks only one?</summary><div class="faq-body">
          <p>In the Bitcoin world it is good practice to use <strong>a new address for every payment you receive</strong>. All the addresses belong to the same wallet and are controlled by the same seed, but anyone watching the blockchain has a much harder time linking your incoming payments together.</p>
          <p>That's why, after generating the wallet, you find the <em>Show more Bitcoin addresses</em> button: it generates ten at a time, all yours.</p>
          <p>On <strong>Ethereum, TRON and Solana</strong> it works differently: you always use the same address, always. That is the normal behaviour of those networks \u2014 it is not a limitation of the program.</p>
        </div></details>

        <details class="faq" id="g-watch"><summary>\u{1F441}\uFE0F Seeing the balance without risking anything (watch-only)</summary><div class="faq-body">
          <p>After generating the Bitcoin addresses, the <em>View xpub and descriptor</em> button shows a <strong>descriptor</strong>: a line of text that describes your wallet <em>without containing the keys to spend</em>. For a normal wallet it is entirely optional \u2014 your words are all you need to recover. In <strong>multisig</strong>, however, <strong>it is essential</strong>: without it, rebuilding the vault is much harder.</p>
          <p>By pasting it into <strong>Sparrow</strong> (<em>File \u2192 Import Wallet \u2192 Output Descriptor</em>) or into Electrum, you get a read-only wallet: you see balance and movements in real time, but nobody \u2014 not even you, from there \u2014 can move the funds. The seed stays safe where it is, without ever touching a connected device.</p>
          <p>It's the best way to keep an eye on a cold wallet from your phone or your everyday computer.</p>
          <p><strong>A privacy warning:</strong> whoever holds the descriptor sees all your Bitcoin movements, present and future. They cannot spend, but it is like handing over a bank statement: share it only with someone you'd trust to see your accounts.</p>
        </div></details>

        <details class="faq" id="g-verify"><summary>\u{1F50D} I have an old backup: how do I check it's good?</summary><div class="faq-body">
          <p>Go to <strong>\u{1F50D} Check wallet</strong> and choose <strong>A complete seed</strong>. Type the words and the program shows you which addresses they generate, without changing anything and without taking the seed onto a connected device.</p>
          <p>If the addresses match those you remember or see in a blockchain explorer, the backup is correct. If they don't match, check in this order: the <strong>passphrase</strong> (had you set one?), the <strong>Bitcoin format</strong> (try the other three), and finally the <strong>later addresses</strong> using the button that shows ten more.</p>
          <p>\u26A0\uFE0F Typing a seed is by far the most delicate moment: do it with the device disconnected from the internet, or better still from a Tails system or a clean virtual machine.</p>
        </div></details>

        <details class="faq" id="g-multisig"><summary>\u{1F510} Multisig: when one key isn't enough</summary><div class="faq-body">
          <p>A <em>multisig</em> address requires several keys to move the funds \u2014 for example 2 signatures out of 3. It is used in two very different ways:</p>
          <p><strong>\u{1F464} All the keys yours.</strong> It's the most common use, and perhaps the best security upgrade for anyone self-custodying. You create three keys and distribute them across three different places. From then on a thief who ransacks your home gets nothing, and you can lose one backup without losing a cent. The moment the keys are born together is the only one in which they coexist.</p>
          <p><strong>\u{1F465} With other people.</strong> For family, company or group funds. Everyone creates their key on their own device and shares only the <strong>xpub</strong>, a public code that reveals nothing secret. Nobody can spend alone.</p>
          <p><strong>To be kept with the backups:</strong> the <em>descriptor</em>, the formula describing how the keys combine. With the seeds alone, but without the descriptor, rebuilding the vault is far more laborious.</p>
        </div></details>

        <details class="faq"><summary>\u{1F4F4} Does it really connect to nothing?</summary><div class="faq-body">
          <p>Really. No network request, at any moment: no servers, no statistics, no silent updates. All the cryptographic libraries are embedded in the file, and nothing is downloaded while you use it.</p>
          <p>It is not only a promise in the code. The file carries a rule for the browser, called <em>Content-Security-Policy</em>, that forbids any connection and any script other than its own: even a bug, or a modified copy of a library, would be stopped by the browser itself.</p>
          <p>Nothing is saved either: no cookies, no local storage, no files written. The seed lives only in the page's memory, and the browser releases it when you close the tab.</p>
          <p><strong>And you can verify it yourself.</strong> Open the file on a computer disconnected from the internet: it works exactly the same way. That is in fact how we recommend using it.</p>
        </div></details>

        <details class="faq"><summary>\u{1F4B8} Can I spend from here?</summary><div class="faq-body">
          <p>No, and it's a deliberate choice. Spending means building transactions and sending them to the network: a whole wallet, with far more code and a reason to go online. AmnesicWallet does one thing \u2014 create wallets in a clean environment \u2014 and keeps it small enough to be checked.</p>
          <p>To receive, the address is enough. To spend, import your words into a compatible wallet: <strong>Electrum</strong> or <strong>Sparrow</strong> for Bitcoin, <strong>MetaMask</strong> or <strong>Rabby</strong> for Ethereum, <strong>TronLink</strong> and <strong>Phantom</strong> for the other networks.</p>
          <p>For significant amounts, the best choice is to import the seed into a <strong>hardware wallet</strong> such as a Ledger or Trezor: it signs transactions internally, without ever exposing the key to the computer.</p>
        </div></details>

        <details class="faq"><summary>\u{1F6E1}\uFE0F The five rules that matter</summary><div class="faq-body">
          <p><strong>1 \xB7 Generate offline.</strong> Disconnect the device from the network, or use a clean bootable USB stick. It's how this tool gives its best.</p>
          <p><strong>2 \xB7 Save the backup before using the wallet.</strong> The words are the only key: whoever holds them holds the funds, whoever loses them loses access. Choose the way of keeping them that you consider safest, and do it before you send any funds.</p>
          <p><strong>3 \xB7 Know your single points of failure.</strong> One sheet in one place can be lost or found. Splitting it (Shamir, SLIP-39) or a multisig vault remove that single point, at the price of more pieces to look after: weigh which risk worries you more.</p>
          <p><strong>4 \xB7 Verify before trusting.</strong> On the same offline device, restore the words in a second program such as Sparrow or Electrum and check that the address matches. Two independent tools that agree are worth more than any guarantee.</p>
          <p><strong>5 \xB7 Do a test run.</strong> Send a token amount, then try recovering it from the backup alone. <strong>An unverified backup is not a backup: it's a hope.</strong></p>
        </div></details>
