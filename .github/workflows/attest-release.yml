name: Certificate of origin for a published release

# For a release published before the Release workflow issued certificates:
# rebuilds the file from the release's tag, checks that it is byte-identical
# to the file committed in that tag and to the one attached to the release,
# and issues GitHub's signed certificate of origin (build provenance) for it.
# Run from the Actions tab ("Run workflow") with the tag, e.g. v1.1.3.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag, e.g. v1.1.3'
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: The tag must look like vX.Y.Z
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release tag like v1.1.3"; exit 1; }

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Rebuild, and compare with the file committed in the tag
        run: |
          npm run build
          git diff --exit-code -- dist/amnesicwallet.html \
            || { echo "::error::The rebuilt file differs from the one in ${{ inputs.tag }}."; exit 1; }

      - name: Compare with the file attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p /tmp/release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern amnesicwallet.html --dir /tmp/release
          cmp /tmp/release/amnesicwallet.html dist/amnesicwallet.html \
            || { echo "::error::The file attached to release $TAG differs from the rebuilt one."; exit 1; }
          sha256sum dist/amnesicwallet.html

      - name: Certificate of origin (build provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/amnesicwallet.html
