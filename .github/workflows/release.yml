name: Release

# Two ways to publish the version written in package.json:
#   - push a tag vX.Y.Z (same number);
#   - or, with the version already on main, run this workflow on main
#     ("Run workflow" in the Actions tab): it creates the tag vX.Y.Z on the
#     current commit together with the release. It refuses a version that
#     is already published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # For the certificate of origin (build provenance attestation) below.
  id-token: write
  attestations: write
  artifact-metadata: write

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: The version to publish is the one in package.json
        id: version
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
          else
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Run this workflow on main, not $GITHUB_REF_NAME."; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
              echo "::error::$v is already published. Raise the version in package.json (and add its CHANGELOG entry) first."; exit 1
            fi
          fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"

      - name: Install exact dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Test, build, hash
        run: npm run release

      - name: The released file must be exactly the committed one
        run: |
          git diff --exit-code -- dist/amnesicwallet.html SHA256SUMS site/index.html \
            || { echo "::error::This commit does not contain the rebuilt file. If you edited on github.com, wait for the automatic 'Rebuild' commit and publish that one."; exit 1; }

      - name: Checksum file
        run: |
          cd dist
          sha256sum amnesicwallet.html > amnesicwallet.html.sha256
          cat amnesicwallet.html.sha256

      # A statement signed through GitHub (Sigstore) that this exact file was
      # built by this workflow, from this commit of this repository. Anyone can
      # check it: gh attestation verify amnesicwallet.html --repo MrAmnesic/amnesicwallet
      - name: Certificate of origin (build provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/amnesicwallet.html

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/amnesicwallet.html
            dist/amnesicwallet.html.sha256
          generate_release_notes: true
          body: |
            ## AmnesicWallet ${{ steps.version.outputs.tag }}

            Offline, single-file wallet generator: BIP-39 and SLIP-39 seeds, Shamir backups, multisig vaults — Bitcoin, Ethereum/EVM, TRON, Solana.

            What changed: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md).

            ### Verify the file before opening it
            ```bash
            sha256sum amnesicwallet.html          # Linux / macOS
            Get-FileHash amnesicwallet.html       # Windows PowerShell
            ```
            The value must match `amnesicwallet.html.sha256` attached here, `SHA256SUMS` in the repository and the one on the website. You can also rebuild it yourself: `npm ci && npm run build` produces the same bytes.

            ### Check where it was built
            ```bash
            gh attestation verify amnesicwallet.html --repo ${{ github.repository }}
            ```
            GitHub's signed certificate of origin says that this file was built by the Release workflow of this repository, from the tagged commit. It works on any copy of the file, including the one on the website.
