name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run derivation test vectors
        run: npm test

      - name: Build single-file artifact
        run: npm run build

      - name: Compute artifact hash
        run: node scripts/hash.js

      - name: Upload built artifact
        uses: actions/upload-artifact@v7
        with:
          name: seedforge-html
          path: dist/seedforge.html
          if-no-files-found: error
